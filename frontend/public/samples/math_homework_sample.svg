<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <!-- Paper Background with grid notebook pattern -->
  <rect width="600" height="800" fill="#f8fafc" />
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e2e8f0" stroke-width="0.8" />
    </pattern>
  </defs>
  <rect width="600" height="800" fill="url(#grid)" />

  <!-- Top bar -->
  <rect x="40" y="30" width="520" height="60" rx="8" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5" />
  <text x="60" y="55" font-family="monospace" font-size="14" font-weight="bold" fill="#312e81">EDU360 DAILY HOMEWORK WORKSHEET #4.2</text>
  <text x="60" y="75" font-family="sans-serif" font-size="12" fill="#4338ca">Student: Arjun Patel (8-B) • Audit Code: #EVD-BKLOG-945 • Status: OVERDUE / LATE</text>

  <!-- Problem 1: Unattempted / Overdue -->
  <rect x="40" y="110" width="520" height="80" rx="8" fill="#fef2f2" stroke="#f87171" stroke-width="1" />
  <text x="60" y="135" font-family="sans-serif" font-size="13" font-weight="bold" fill="#991b1b">Problem 1: Factorize by Grouping: 6x² - 9x + 4x - 6</text>
  <text x="60" y="165" font-family="sans-serif" font-size="12" fill="#b91c1c" font-style="italic">[UNATTEMPTED — Blank Space in Student Rough Diary]</text>
  <text x="440" y="165" font-family="sans-serif" font-size="12" font-weight="bold" fill="#dc2626">0/5 Marks</text>

  <!-- Problem 2: Attempted with sign mistake -->
  <rect x="40" y="210" width="520" height="150" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
  <text x="60" y="235" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">Problem 2: Expand and Simplify: 4(x - 3) - 2(3x - 5)</text>
  <text x="70" y="265" font-family="monospace" font-size="13" fill="#334155">Step 1: 4x - 12 - 6x - 10</text>
  <ellipse cx="235" cy="261" rx="28" ry="12" fill="none" stroke="#ef4444" stroke-width="2" />
  <text x="270" y="265" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ef4444">&lt;-- ERROR: -2 * -5 = +10, NOT -10!</text>
  <text x="70" y="295" font-family="monospace" font-size="13" fill="#334155">Step 2: -2x - 22 (INCORRECT)</text>
  <text x="70" y="325" font-family="sans-serif" font-size="11" fill="#16a34a">Correct Answer should be: -2x - 2</text>
  <text x="440" y="325" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ea580c">2/5 Marks</text>

  <!-- Problem 3: Attempted with middle term split error -->
  <rect x="40" y="380" width="520" height="150" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
  <text x="60" y="405" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">Problem 3: Solve: x² - 7x + 12 = 0</text>
  <text x="70" y="435" font-family="monospace" font-size="13" fill="#334155">Step 1: Factors of 12 that add up to -7 are +3 and +4</text>
  <ellipse cx="370" cy="431" rx="40" ry="12" fill="none" stroke="#ef4444" stroke-width="2" />
  <text x="415" y="435" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ef4444">&lt;-- WRONG! Must be -3 and -4</text>
  <text x="70" y="465" font-family="monospace" font-size="13" fill="#334155">Step 2: (x + 3)(x + 4) = 0 => x = -3, -4</text>
  <text x="70" y="495" font-family="sans-serif" font-size="11" fill="#16a34a">Correct Roots: x = +3, +4</text>
  <text x="440" y="495" font-family="sans-serif" font-size="12" font-weight="bold" fill="#dc2626">1/5 Marks</text>

  <!-- Homework Summary Box -->
  <rect x="40" y="550" width="520" height="120" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5" />
  <text x="60" y="580" font-family="sans-serif" font-size="13" font-weight="bold" fill="#92400e">TEACHER HOMEWORK LOG &amp; CORRELATION:</text>
  <text x="60" y="605" font-family="sans-serif" font-size="12" fill="#78350f">Total Homework Score: 3/15 (20%) • Submission: 3 Days Late</text>
  <text x="60" y="628" font-family="sans-serif" font-size="11" fill="#78350f">Teacher Note: "Directly mirrors his Exam Question 2 and Question 3 errors.</text>
  <text x="60" y="648" font-family="sans-serif" font-size="11" fill="#78350f">Arjun does not understand double-negative sign multiplication inside brackets."</text>
</svg>
